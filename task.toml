tags = ["event-sourcing", "cqrs", "projection-rebuild", "replay-engine", "aggregate-streams"]

difficulty_explanation = "Requires identifying four interacting bugs across four source files: a whitespace parsing issue in aggregate stream configuration, a wrong config section reference for snapshot interval, an accumulation logic error in epoch replay statistics, and a missing sort key component for deterministic event ordering. The bugs are subtle and their effects compound across processing stages."
solution_explanation = "Fix stream_loader.py to strip whitespace from comma-split active_aggregates list, fix event_projector.py to read snapshot_interval from [projection.materialized] instead of [projection], fix replay_engine.py to use assignment instead of accumulation for per-epoch aggregate counts, and fix event_ordering.py sort key to include aggregate_id between timestamp and seq_number."
verification_explanation = "Tests validate output correctness at multiple levels: basic structure, individual bug effects (inventory events present, correct snapshot interval, correct epoch stats), and combined correctness (event ordering, total event count, full replay log accuracy). All 10 tests must pass."
expert_time_estimate_hours = 3.0

[task]
name = "event-store-replay-repair"
description = "Debug an event sourcing replay engine that rebuilds materialized projections from aggregate event streams. The system has four subtle defects causing incorrect stream filtering, degenerate projection scores, inflated epoch statistics, and non-deterministic event ordering."

[task.difficulty]
level = "hard"
reasoning = "Four interacting bugs across multiple files require understanding of event sourcing patterns, configuration parsing, epoch-based replay mechanics, and sort stability. Bugs are not indicated by comments or obvious code smells."

[task.runtime]
entrypoint = "python3 -m runtime.run_replay"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the event store replay engine and validates replay log and projection statistics against expected correct values using pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches four bugs in the runtime source files and re-runs the engine to produce correct output."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
