tags = ["compiler", "ir-optimization", "dead-code-elimination", "constant-folding", "pass-engine"]

difficulty_explanation = "Requires identifying four interacting bugs across multiple source files: a whitespace parsing issue hidden inside a registry helper method, a wrong config section reference for pass parameters affecting dead code elimination thresholds, an accumulation logic error in window metric computation buried in nested loops, and a missing sort key component for deterministic instruction ordering. The bugs compound — incorrect module loading affects use-def analysis, wrong pass parameters prevent elimination, and these interact with metrics aggregation."
solution_explanation = "Fix module_loader.py ModuleRegistry._resolve_active_modules to strip whitespace from comma-split module names, fix pass_engine.py to read pass_depth and inline_threshold from [optimizer.passes] instead of [optimizer], fix pass_engine.py to use assignment instead of accumulation for per-window metrics, and fix pass_engine.py sort key to include module_id between timestamp and seq."
verification_explanation = "Tests validate output correctness at multiple levels: basic structure, individual bug effects (memory module present, correct pass depth, correct window metrics), and combined correctness (instruction ordering, total count, dead code elimination requiring all bugs fixed simultaneously). All 10 tests must pass."
expert_time_estimate_hours = 3.5

[task]
name = "ir-optimizer-repair"
description = "Debug a compiler IR optimization engine that applies dead code elimination and constant folding passes to instruction streams from multiple modules. The system has four subtle defects in module registry filtering, pass configuration loading, metrics aggregation, and instruction ordering that compound to produce incorrect optimization results."

[task.difficulty]
level = "hard"
reasoning = "Four interacting bugs across multiple files require understanding of compiler IR concepts, use-def analysis, configuration parsing with registry indirection, windowed metric computation, and sort stability. The module filtering bug is hidden inside a registry helper class, and dead code elimination results depend on all three other bugs being fixed (correct modules loaded, correct threshold, correct ordering affects use counts)."

[task.runtime]
entrypoint = "python3 -m runtime.run_optimizer"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the IR optimizer engine and validates optimization reports and analysis metrics against expected correct values using pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches four bugs in the runtime source files and re-runs the engine to produce correct output."

