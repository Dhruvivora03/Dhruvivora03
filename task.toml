author_name = "Dhruvkumar Patel"
author_email = "dhruvpatel2284@gmail.com"
category = "cryptographic_verification"
difficulty = "hard"
tags = ["merkle-tree", "cryptography", "proof-verification", "hash-chains", "dead-code"]

difficulty_explanation = "Requires identifying four interacting bugs: whitespace parsing in chain registry affecting which hash chains are loaded, an off-by-one error in verification round loop (range(n-1) vs range(n)), a wrong comparison operator (> vs >=) combined with accumulation logic in window metrics, and a wrong sort field (leaf_hash vs position) for proof ordering. The bugs compound — missing chains affect verification scores, fewer rounds change coverage ratios, and wrong ordering affects window boundary composition."
solution_explanation = "Fix chain_registry.py to strip whitespace from comma-split chain names, fix verifier_engine.py to use range(self._rounds) instead of range(self._rounds - 1), fix verifier_engine.py depth comparison from > to >= AND change window accumulation from += to = (assignment), and fix sort key from leaf_hash to position for deterministic merkle tree node ordering."
verification_explanation = "Tests validate at multiple levels: basic structure, individual bugs (keccak chain present, correct coverage, correct depth transitions), and combined correctness (proof ordering, total count, full verification scores requiring all bugs fixed). The verification_scores test computes actual SHA-256 hashes making it impossible to guess correct values."
expert_time_estimate_hours = 4.0

[task]
name = "merkle-verifier-repair"
description = "Debug a merkle proof verification engine that validates cryptographic proofs across multiple hash chains. The system has four subtle defects in chain registry filtering, verification round iteration, depth transition tracking with window metrics, and proof ordering that compound to produce incorrect verification results."

[task.difficulty]
level = "hard"
reasoning = "Four interacting bugs require understanding of cryptographic hash verification, merkle tree node positioning, off-by-one iteration errors, comparison operator semantics in depth tracking, and sort field selection. The chain loading bug affects verification scores through use-count dependencies, and the off-by-one is disguised as intentional zero-indexing."

[task.runtime]
entrypoint = "python3 -m runtime.run_verifier"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the merkle verification engine and validates proof ordering, verification scores, and metrics against expected correct values using pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches four bugs in the runtime source files and re-runs the engine to produce correct output."

