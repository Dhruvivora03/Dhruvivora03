[task]
name = "threat-intel-repair"
description = "Debug a network security threat correlation engine where segments track threat vectors through PROBE, BREACH, and CORRELATE events. The threat accumulator has a timing bug in its self-increment during correlation, the correlation analyzer has swapped classification labels in a multi-phase lattice analysis pipeline, and the triage function uses the wrong severity metric."

