[task]
name = "token-flow-repair"
description = "Debug a backward dataflow liveness analysis system for register-based bytecode. Fix errors in the transfer function, interference criterion, and allocation priority metric."

[task.difficulty]
level = "hard"
reasoning = "The bugs exploit compiler-theory reasoning: a plausible but wrong set subtraction in the transfer function (USE instead of DEF), an overly conservative interference check (OR instead of AND) defended as preventing subtle coloring bugs, and a wrong priority metric (def count instead of degree) defended as minimizing spill cost."

