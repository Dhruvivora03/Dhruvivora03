author_name = "Dhruvkumar Patel"
author_email = "dhruvpatel2284@gmail.com"
category = "task_scheduling"
difficulty = "hard"
tags = ["task-scheduler", "priority-queue", "dependency-resolution", "deadline-scheduling", "execution-planning"]

difficulty_explanation = "Requires identifying four interacting bugs across three source files: a whitespace parsing issue in stream configuration, a wrong config section reference for urgency parameters, an accumulation logic error in wave processing statistics, and a missing sort key component for deterministic execution ordering. The bugs are subtle and their effects compound across stages."
solution_explanation = "Fix stream_loader.py to strip whitespace from comma-split active streams list, fix priority_queue.py to read urgency_multiplier from [scheduling.deadline] instead of [scheduling], fix dependency_resolver.py to use assignment instead of accumulation for per-wave stream counts, and fix priority_queue.py sort key to include stream_id between priority_score and seq_number."
verification_explanation = "Tests validate output correctness at multiple levels: basic structure, individual bug effects (network jobs present, correct urgency multiplier, correct wave stats), and combined correctness (execution ordering, total job count, full plan accuracy). All 10 tests must pass."
expert_time_estimate_hours = 3.0

[task]
name = "task-scheduler-repair"
description = "Debug a deadline-based task scheduling engine that builds a priority queue from job streams and resolves dependencies in waves. The system has four subtle defects causing incorrect stream filtering, degenerate priority scores, inflated wave statistics, and non-deterministic execution ordering."

[task.difficulty]
level = "hard"
reasoning = "Four interacting bugs across multiple files require understanding of configuration parsing, priority queue mechanics, wave-based dependency resolution, and sort stability. Bugs are not indicated by comments or obvious code smells."

[task.runtime]
entrypoint = "python3 -m runtime.run_scheduler"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the task scheduling engine and validates execution plan and queue statistics against expected correct values using pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches four bugs in the runtime source files and re-runs the engine to produce correct output."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
