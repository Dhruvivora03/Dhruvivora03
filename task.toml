author_name = "Dhruvkumar Patel"
author_email = "dhruvpatel2284@gmail.com"
category = "Graphics / Image / Video"
difficulty = "hard"
tags = ["audio-forensics", "fingerprinting", "cosine-similarity", "hierarchical-clustering", "signal-processing", "deduplication"]
difficulty_explanation = "Requires understanding three distinct signal processing concepts: sliding window overlap for temporal resolution, cosine vs dot-product similarity for scale-invariant comparison, and complete vs single linkage for cluster cohesion. Each bug is defended by a plausible but incorrect engineering justification."
solution_explanation = "Three bugs across three files: (1) fingerprint_engine.py uses stride=window_size instead of stride=window_size//2, (2) similarity_matrix.py computes raw dot product instead of cosine similarity, (3) cluster_builder.py uses single-linkage instead of complete-linkage clustering."
verification_explanation = "14 tests in 4 tiers: 6 structural (always pass), 3 fingerprint (need bug 1 fix), 3 similarity/clustering (need bugs 2+3 fix), 2 consistency (need all fixes). NOP yields 8 pass / 6 fail. Oracle yields 14 pass / 0 fail."
expert_time_estimate_hours = 2.5

[task]
name = "audio-fingerprint-repair"
description = "Debug an audio forensics pipeline that incorrectly computes spectral fingerprints with non-overlapping windows, uses unnormalized dot product instead of cosine similarity, and applies single-linkage clustering instead of complete-linkage for duplicate detection."

[task.difficulty]
level = "hard"
reasoning = "Three conceptually independent bugs in different algorithmic domains (signal windowing, similarity metrics, clustering linkage) each masked by convincing but incorrect engineering rationales. The chaining effect of single-linkage combined with inflated unnormalized scores makes diagnosis non-obvious."

[task.runtime]
entrypoint = "python3 /app/runtime/run_forensics.py"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs 14 pytest tests across 4 difficulty tiers validating fingerprint segments, similarity normalization, cluster formation, and end-to-end digest consistency."

[task.repair]
command = "bash solution/solve.sh"
description = "Fixes window stride to 50% overlap, normalizes similarity to cosine, and switches to complete-linkage clustering."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
