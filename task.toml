author_name = "Dhruvkumar Patel"
author_email = "dhruvpatel2284@gmail.com"
category = "event_sourcing"
difficulty = "hard"
tags = ["event-sourcing", "cqrs", "replay-engine", "stream-processing", "projections"]

difficulty_explanation = "Requires identifying four interacting bugs across three source files: a whitespace parsing issue in stream configuration, a wrong config section reference for snapshot parameters, an accumulation logic error in window aggregates, and a missing sort key component for deterministic replay ordering. The bugs are subtle and their effects compound across the replay sequence."
solution_explanation = "Fix stream_loader.py to strip whitespace from comma-split active streams list, fix event_store.py to read snapshot_interval from [projection.incremental] instead of [projection], fix projection_engine.py to use assignment instead of accumulation for per-window aggregate counts, and fix event_store.py replay sort key to include stream_id between timestamp and sequence_number."
verification_explanation = "Tests validate output correctness at multiple levels: basic structure, individual bug effects (inventory events present, correct snapshot interval, correct window aggregates), and combined correctness (replay ordering at timestamp ties, total event count, deterministic checksum). All 10 tests must pass."
expert_time_estimate_hours = 3.0

[task]
name = "event-store-replay-repair"
description = "Debug an event sourcing replay engine that ingests domain events from multiple streams, builds materialized view projections, and produces aggregate statistics. The system has four subtle defects causing missing stream data, disabled snapshots, inflated aggregates, and non-deterministic replay ordering."

[task.difficulty]
level = "hard"
reasoning = "Four interacting bugs across multiple files require understanding of configuration parsing, event store internals, window-based aggregation semantics, and sort stability for deterministic replay. Bugs are not indicated by comments or obvious code smells."

[task.runtime]
entrypoint = "python3 -m runtime.run_replay"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the event store replay engine and validates projection results and store statistics against expected correct values using pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches four bugs in the runtime source files and re-runs the engine to produce correct output."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
