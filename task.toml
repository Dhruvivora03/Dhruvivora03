tags = ["gpu-profiling", "shader-pipeline", "vector-math", "partial-orders", "graphics-programming"]
difficulty_explanation = "Requires understanding vector partial orders in a GPU profiling context, distinguishing equality from incomparability in component-wise comparisons, and recognizing that synchronization barriers consume execution cycles. Misleading comments actively steer toward the buggy interpretation."
solution_explanation = "Three bugs across two files: (1) cycle_counter.py missing self-increment after SYNC merge, (2) pipeline_analyzer.py checking vector equality instead of incomparability for disjointness, (3) pipeline_analyzer.py sorting by temporal recency instead of vector sum for priority."
verification_explanation = "14 tests in 4 tiers: 6 structural (always pass), 3 cycle state (need bug 1 fix), 3 pipeline classification (need bugs 2+3 fix), 2 consistency (need all fixes). NOP yields 8 pass / 6 fail. Oracle yields 14 pass / 0 fail."
expert_time_estimate_hours = 2.5

[task]
name = "shader-profiler-repair"
description = "Debug a GPU shader pipeline profiler that incorrectly tracks execution cycles during synchronization barriers, misclassifies stage disjointness between shader programs, and uses wrong priority ordering for workload scheduling."

[task.difficulty]
level = "hard"
reasoning = "The bugs involve subtle mathematical distinctions (equality vs incomparability in partial orders) masked by authoritative misleading comments about GPU pipeline behavior. The SYNC self-increment bug requires understanding that synchronization barriers are active events consuming GPU cycles."

[task.runtime]
entrypoint = "python3 /app/runtime/run_profiler.py"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs 14 pytest tests across 4 difficulty tiers validating cycle vectors, stage classification, priority ordering, and end-to-end digest consistency."

[task.repair]
command = "bash solution/solve.sh"
description = "Fixes cycle self-increment after SYNC, replaces equality with incomparability for stage disjointness, and corrects priority to use vector sum instead of temporal recency."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
