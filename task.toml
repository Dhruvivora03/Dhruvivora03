[task]
name = "dataflow-widening-repair"
description = "Debug an abstract interpretation engine computing widened fixed points over a 7-node control flow graph. The lattice height tracker incorrectly guards its own component during join operations, the convergence detector confuses lattice equality with independence, and the worklist scheduler uses the wrong priority metric."

