[task]
slug = "token-flow-repair"
title = "Token Flow Repair: Dataflow Liveness Analysis Debugging"
category = "Programming Languages / Compilers / Parsers"
difficulty = "hard"

[task.description]
summary = "Debug a backward dataflow liveness analysis system for register-based bytecode. Fix errors in the transfer function, interference criterion, and allocation priority metric."
domain = "compilers"
concepts = ["dataflow analysis", "liveness", "interference graphs", "register allocation", "graph coloring"]

[author]
name = "Dhruvkumar Patel"
email = "dhruvpatel2284@gmail.com"

[environment]
dockerfile = "environment/Dockerfile"
runtime_dir = "runtime/"
data_dir = "runtime/data/"

[testing]
test_script = "tests/test.sh"
test_file = "tests/test_dataflow.py"
total_tests = 14
nop_pass = 8
nop_fail = 6
oracle_pass = 14
oracle_fail = 0

[testing.tiers]
tier1 = { name = "Structural", tests = 6, description = "File existence, format, register names" }
tier2 = { name = "Liveness Correctness", tests = 3, description = "Live set validation at key program points" }
tier3 = { name = "Interference & Priority", tests = 3, description = "Graph structure and allocation ordering" }
tier4 = { name = "Digest & Cross-Validation", tests = 2, description = "Fingerprint and internal consistency" }

[solution]
script = "solution/solve.sh"
repair_file = "solution/repair_token_flow.py"

[bugs]
count = 4

[[bugs.entries]]
file = "liveness_engine.py"
description = "Transfer function subtracts USE(n) instead of DEF(n) from LiveOut"
severity = "critical"
cascades = false

[[bugs.entries]]
file = "interference_builder.py"
description = "Interference check uses OR instead of AND (overly conservative)"
severity = "major"
cascades = true

[[bugs.entries]]
file = "allocation_scorer.py"
description = "Priority uses definition count instead of interference degree"
severity = "moderate"
cascades = false

[[bugs.entries]]
file = "analysis_output.py"
description = "Cascades from interference_builder - uses buggy interference graph"
severity = "cascade"
cascades = true
