[task]
name = "sdf-compositor-repair"
description = "Debug an SDF ray marching compositor that renders 7 CSG primitives. The distance accumulator incorrectly excludes self-distance from blending with a Lipschitz-continuity guard, the occlusion analyzer confuses shadow alignment with shadow independence, and the render queue uses the wrong geometric complexity metric."

