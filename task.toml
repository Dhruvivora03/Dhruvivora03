difficulty_explanation = "Bug 1 requires two coordinated changes: removing a plausible guard (continue statement) AND adding a missing increment. Bug 2 requires distinguishing equality from incomparability in a partial order. Bug 3 requires identifying that lattice spread is the wrong metric for worklist priority. The continue statement has a convincing comment about preventing 'circular self-reinforcement' that misdirects debugging."
solution_explanation = "Fix 1: Remove the 'if point == self.point_id: continue' guard AND add self._height[self.point_id] += 1 after the merge loop. Fix 2: Replace symmetric boundedness with incomparability (neither dominates). Fix 3: Replace spread sort with vector-sum sort."
verification_explanation = "14 tests in 4 tiers: 6 structural (always pass), 3 state-value (need Fix 1), 3 convergence (need Fixes 2+3), 2 consistency (need all). NOP=8pass/6fail, Oracle=14pass/0fail."
expert_time_estimate_hours = 2.5

[task]
name = "fixpoint-lattice-repair"
description = "Debug an abstract interpretation engine that computes fixed points over a CFG. The lattice engine skips own-component merging during JOIN with a plausible but incorrect guard, the convergence analyzer uses equality instead of incomparability, and the worklist uses spread instead of sum for priority."

[task.difficulty]
level = "hard"
reasoning = "Bug 1 requires a two-part fix (remove guard + add increment) defended by a convincing anti-self-amplification comment. Bug 2 requires partial order reasoning. Bug 3 uses a plausible alternative metric."

