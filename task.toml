[task]
name = "particle-collision-repair"
description = "Debug a particle collision simulation that incorrectly tracks momentum exchange during elastic collisions, misclassifies trajectory independence between particles, and uses wrong priority ordering for energy harvesting probes."

[task.difficulty]
level = "hard"
reasoning = "The bugs involve subtle mathematical distinctions (equality vs incomparability in partial orders) masked by authoritative misleading comments. The collision self-increment bug requires understanding that elastic collision is an active event, not passive knowledge transfer."

[task.runtime]
entrypoint = "python3 /app/runtime/run_simulation.py"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs 14 pytest tests across 4 difficulty tiers validating momentum vectors, trajectory classification, priority ordering, and end-to-end digest consistency."

[task.repair]
command = "bash solution/solve.sh"
description = "Fixes momentum self-increment after COLLIDE, replaces equality with incomparability for trajectory independence, and corrects priority to use vector sum instead of temporal recency."

