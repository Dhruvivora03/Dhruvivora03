author_name = "Dhruvkumar Patel"
author_email = "dhruvpatel2284@gmail.com"
category = "task_scheduling"
difficulty = "hard"
tags = ["task-scheduler", "dependency-resolution", "topological-sort", "priority-queue", "resource-management"]

difficulty_explanation = "Requires identifying four interacting bugs across three source files: a whitespace parsing issue in category configuration, a wrong config section reference for epoch sizing, an accumulation logic error in resource computation, and a missing sort key component for deterministic priority tiebreaking. The bugs are subtle and their effects compound across the scheduling process."
solution_explanation = "Fix job_loader.py to strip whitespace from comma-split active categories list, fix scheduler_engine.py to read epoch_size from [scheduling.parallel] instead of [scheduling], fix scheduler_engine.py to use assignment instead of accumulation for per-epoch resources, and fix scheduler_engine.py sort key to include category_id between priority and seq for deterministic ordering."
verification_explanation = "Tests validate output correctness at multiple levels: basic structure, individual bug effects (maintenance jobs present, correct epoch size, correct resources), and combined correctness (priority tiebreaking, total count, full duration accuracy). All 10 tests must pass."
expert_time_estimate_hours = 3.0

[task]
name = "scheduler-repair"
description = "Debug a task scheduler engine that resolves job dependencies via topological sort with priority-based tiebreaking and produces execution plans with resource utilization reports. The system has four subtle defects causing incorrect category filtering, oversized processing epochs, inflated resource counts, and non-deterministic job ordering."

[task.difficulty]
level = "hard"
reasoning = "Four interacting bugs across multiple files require understanding of dependency graphs, topological sorting, configuration parsing, epoch-based aggregation, and sort stability. Bugs are not indicated by comments or obvious code smells."

[task.runtime]
entrypoint = "python3 -m runtime.run_scheduler"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the scheduler engine and validates execution plan and resource reports against expected correct values using pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches four bugs in the runtime source files and re-runs the engine to produce correct output."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
