category = "Cybersecurity"
difficulty = "hard"
tags = ["intrusion-detection", "threat-propagation", "network-segmentation", "incident-response", "partial-orders"]
difficulty_explanation = "Requires understanding that the conditional lateral attribution is incorrect (should always attribute), that uniform-polarity of the difference vector checks subsumption/dominance (the OPPOSITE of safe isolation), and that L2 norm is wrong for triage priority (correct: linear sum). Bugs are defended by authoritative security-domain docstrings."
solution_explanation = "Three fixes: (1) Remove conditional check in process_lateral so own threat always increments, (2) Replace uniform-polarity isolation check with mixed-polarity check (incomparability), (3) Replace geometric magnitude triage with simple sum. The report file cascades fix from the classifier."
verification_explanation = "14 tests in 4 tiers: 6 structural (always pass), 3 threat state (need fix 1), 3 isolation classification (need fixes 2+3), 2 full consistency (need all fixes). NOP yields 8 pass / 6 fail, oracle yields 14 pass / 0 fail."
expert_time_estimate_hours = 2.5

[task]
name = "threat-propagation-repair"
description = "Debug a network intrusion detection pipeline that incorrectly computes threat propagation vectors, misclassifies segment isolation safety, and produces wrong triage priorities."

[task.difficulty]
level = "hard"
reasoning = "The bugs exploit security-domain reasoning: a conditional attribution that only fires when the adjacent segment reports higher threat (the attribution IS present but conditionally disabled), an inverted isolation predicate (uniform-polarity = dominance/subsumption, but docstring argues it means safe isolation), and Euclidean magnitude triage that sounds mathematically rigorous but gives wrong ordering."

[task.runtime]
entrypoint = "python3 /app/runtime/run_detection.py"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs 14 pytest tests across 4 tiers validating structural output, threat correctness, isolation classification, and fingerprint consistency."

[task.repair]
command = "bash solution/solve.sh"
description = "Applies fixes to propagation_model.py and segment_classifier.py, then re-runs detection."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
