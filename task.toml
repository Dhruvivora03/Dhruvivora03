difficulty_explanation = "Requires identifying four interacting bugs across three source files: a whitespace parsing issue in stream configuration, a wrong config section reference for window sizing, an accumulation logic error in projection computation, and a missing sort key component for deterministic event ordering. The bugs are subtle and their effects compound across the replay process."
solution_explanation = "Fix event_loader.py to strip whitespace from comma-split active streams list, fix ledger_engine.py to read window_size from [replay.streaming] instead of [replay], fix ledger_engine.py to use assignment instead of accumulation for per-window projections, and fix ledger_engine.py sort key to include stream_id between timestamp and seq for deterministic ordering."
verification_explanation = "Tests validate output correctness at multiple levels: basic structure checks, individual bug effects (adjustment events present, correct window size, correct projections), and combined correctness (event ordering, total count, full balance accuracy). All 10 tests must pass."
expert_time_estimate_hours = 3.0

[task]
name = "event-ledger-repair"
description = "Debug an event sourcing ledger replay engine that processes transaction events from multiple streams into account balance projections. The system has four subtle defects causing incorrect stream filtering, oversized processing windows, inflated projections, and non-deterministic event ordering."

[task.difficulty]
level = "hard"
reasoning = "Four interacting bugs across multiple files require understanding of event sourcing patterns, configuration parsing, windowed aggregation semantics, and sort stability. Bugs are not indicated by comments or obvious code smells."

[task.runtime]
entrypoint = "python3 -m runtime.run_ledger"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the ledger replay engine and validates event ordering, account balances, and projection statistics against expected correct values using pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches four bugs in the runtime source files and re-runs the engine to produce correct output."

