tags = ["lattice-methods", "thermal-simulation", "vector-clocks", "partial-orders", "numerical-computing"]
difficulty_explanation = "Requires understanding of partial order theory applied to energy vectors, distinguishing vector equality from incomparability, and recognizing that synchronization events must increment the local component. The misleading comments actively defend buggy behavior as correct engineering decisions."
solution_explanation = "Three code fixes across two files: (1) Add self._energy[self.node_id] += 1 after the merge loop in apply_equilibrate, (2) Replace equality-based independence check with incomparability check using vector_dominates, (3) Replace recency-based priority with sum-based priority. The report file cascades fix from the analyzer."
verification_explanation = "14 tests in 4 tiers: 6 structural (always pass), 3 energy state (need fix 1), 3 independence classification (need fixes 2+3), 2 full consistency (need all fixes). NOP yields 8 pass / 6 fail, oracle yields 14 pass / 0 fail."
expert_time_estimate_hours = 2.5

[task]
name = "lattice-thermal-repair"
description = "Debug a lattice-based thermal diffusion simulation that incorrectly computes energy propagation vectors, misclassifies thermal independence between nodes, and produces wrong scheduling priorities."

[task.difficulty]
level = "hard"
reasoning = "The bugs exploit subtle distinctions in partial order theory (equality vs incomparability) with misleading comments that defend buggy behavior. The independence predicate uses a mathematically valid concept (bidirectional ordering = equality) confused with the required concept (mutual non-dominance = incomparability). Combined with missing state increments and wrong sort keys, this requires deep understanding of vector-based distributed state tracking."

[task.runtime]
entrypoint = "python3 /app/runtime/run_simulation.py"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs 14 pytest tests across 4 tiers validating structural output, energy correctness, independence classification, and digest consistency."

[task.repair]
command = "bash solution/solve.sh"
description = "Applies fixes to diffusion_engine.py and lattice_analyzer.py, then re-runs the simulation."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
