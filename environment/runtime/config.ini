[general]
project_name = Account Ledger Replay Engine
version = 3.1.0
output_dir = output

[streams]
active_streams = payments,refunds, adjustments
data_dir = data
payments_file = payments_stream.csv
refunds_file = refunds_stream.csv
adjustments_file = adjustments_stream.csv

[replay]
window_size = 30
ordering = timestamp_asc
dedup_enabled = true

[replay.streaming]
window_size = 10
ordering = timestamp_asc
dedup_enabled = true
flush_interval = 5

[projection]
output_format = json
include_running_balance = true
group_by = account_id
