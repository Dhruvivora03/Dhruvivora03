[general]
project_name = Merkle Proof Verification Engine
version = 2.1.0
output_dir = output

[chains]
enabled_chains = sha256,blake2b, keccak256
data_dir = data
sha256_file = sha256_proofs.csv
blake2b_file = blake2b_proofs.csv
keccak256_file = keccak256_proofs.csv

[chains.registry]
sha256 = active
blake2b = active
keccak256 = active

[verifier]
verification_rounds = 3
batch_size = 7
require_canonical = true
max_proof_depth = 32

[metrics]
window_size = 8
track_depth_transitions = true
emit_per_chain = true
