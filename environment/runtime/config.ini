[general]
project_name = Bytecode Compiler
version = 2.4.1
output_dir = output

[compiler]
source_dir = data
source_files = arithmetic.src,variables.src, complex.src
max_statements = 500
emit_debug = false

[optimizer]
algorithm = multi_pass
level = 1
max_iterations = 10
enable_stats = true

[optimizer.passes]
level = 3
constant_fold = true
dead_store = true
peephole = true
fold_threshold = 100

[output]
format = json
include_raw = true
include_symbols = true
verbose = false
