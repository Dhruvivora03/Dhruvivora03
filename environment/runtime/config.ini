[general]
project_name = Event Store Replay Engine
version = 2.4.0
output_dir = output

[aggregates]
active_aggregates = orders,payments, inventory
data_dir = data
orders_file = orders_events.csv
payments_file = payments_events.csv
inventory_file = inventory_events.csv

[projection]
algorithm = materialized
snapshot_interval = 50
consistency_check = true

[projection.materialized]
snapshot_interval = 5
merge_strategy = last_writer_wins
conflict_resolution = timestamp_ordered

[replay]
epoch_size = 4
max_retries = 3
timeout_seconds = 60
