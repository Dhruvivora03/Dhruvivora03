[general]
project_name = Event Store Replay Engine
version = 3.1.0
output_dir = output

[streams]
active_streams = orders,payments, inventory
data_dir = data
orders_file = orders_stream.csv
payments_file = payments_stream.csv
inventory_file = inventory_stream.csv

[projection]
algorithm = incremental
snapshot_interval = 100
enable_compaction = true
max_projections = 1000

[projection.incremental]
snapshot_interval = 10
compaction_threshold = 50
merge_strategy = last_write_wins

[replay]
window_size = 20
max_replay_events = 10000
ordering = timestamp_deterministic
