[general]
project_name = GeoSpatial Index Engine
version = 2.4.1
output_dir = output

[feeds]
active_feeds = sensor,landmark, zone
data_dir = data
sensor_file = sensor_feed.csv
landmark_file = landmark_feed.csv
zone_file = zone_feed.csv

[indexing]
algorithm = rtree
max_leaf_capacity = 50
min_leaf_capacity = 2
dimension = 2

[indexing.rtree]
max_leaf_capacity = 8
min_leaf_capacity = 3
reinsert_fraction = 0.3
dimension = 2

[queries]
batch_size = 2
range_queries_file = range_queries.csv
knn_queries_file = knn_queries.csv
knn_k = 5
