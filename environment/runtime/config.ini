[general]
project_name = Job Scheduler Engine
version = 2.7.3
output_dir = output

[categories]
active_categories = compute,io, maintenance
data_dir = data
compute_file = compute_jobs.csv
io_file = io_jobs.csv
maintenance_file = maintenance_jobs.csv

[scheduling]
epoch_size = 30
max_concurrent = 8
priority_threshold = 50
sort_order = priority_desc

[scheduling.parallel]
epoch_size = 10
max_concurrent = 4
priority_threshold = 60
sort_order = priority_desc
rebalance_interval = 3

[output]
format = json
include_timing = true
include_dependency_depth = true
