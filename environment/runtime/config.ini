[general]
project_name = Deadline Task Scheduler
version = 3.1.0
output_dir = output

[streams]
active_streams = compute,io, network
data_dir = data
compute_file = compute_jobs.csv
io_file = io_jobs.csv
network_file = network_jobs.csv

[scheduling]
algorithm = deadline
urgency_multiplier = 1.0
base_priority = 10
wave_size = 3

[scheduling.deadline]
urgency_multiplier = 2.5
base_priority = 10
slack_threshold = 5
preemption_enabled = false

[execution]
wave_size = 3
max_concurrent = 4
timeout_seconds = 120
