[general]
project_name = IR Optimization Engine
version = 4.2.0
output_dir = output

[modules]
active_modules = arithmetic,control_flow, memory_ops
data_dir = data
arithmetic_file = arithmetic_ops.csv
control_flow_file = control_flow_ops.csv
memory_ops_file = memory_ops.csv

[optimizer]
pass_depth = 5
fold_constants = true
eliminate_dead = true
inline_threshold = 100

[optimizer.passes]
pass_depth = 2
fold_constants = true
eliminate_dead = true
inline_threshold = 10
propagation_limit = 3

[analysis]
window_size = 8
output_format = json
track_provenance = true
emit_diagnostics = false
